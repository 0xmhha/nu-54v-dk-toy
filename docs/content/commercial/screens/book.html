e":"../products/p01-device-firmware/prd.md"},"P01.R5":{"title":"대여 반납·개인 초기화","criteria":"대여 반납으로 개인 키가 삭제되거나 승인되지 않은 개인 송금이 발생하는 사례 0건.","behavior":"대여 종료 권한은 대여 슬롯에 한정한다. 개인 루트 삭제와 자가 서명 루트 전환에는 별도 물리 확인과 복구 수단이 필요하다.","source":"../products/p01-device-firmware/prd.md"},"P01.R6":{"title":"계정 재발견·고급 승인","criteria":"타 지갑 descriptor·위장 거스름돈·불명확한 allowance 거절. 복원한 계정에서 같은 주소를 재발견한다.","behavior":"계정·주소 유형별 재발견과 선택적 읽기 전용 xpub/descriptor 내보내기를 별도 동의로 제공한다. PSBT 공동서명은 등록 정책·서명자·거스름돈 검증 후, EVM 권한 변경은 spender·금액과 독립 표시 정책 확인 후 허용한다.","source":"../products/p01-device-firmware/prd.md"},"P01.UC1":{"title":"처음 만든 보드로 수신하기","criteria":"재부팅 전후 등록 건수, 동일 파생 주소, 민감값이 없는 진단 자료.","behavior":"이미지 확인 → 설치 → 기기 식별 키 등록 → 개인 루트 생성 → 백업·복원 확인 → 첫 주소 확인.","source":"../products/p01-device-firmware/use-cases.md"},"P01.UC2":{"title":"거래 승인 또는 거절","criteria":"정상 여섯 전송과 수취인 변경·체인 불일치·거절 벡터에서 서명 수 대조.","behavior":"원문 해석 → 기기가 만든 요약 표시 → 수취인·수수료 확인 → 버튼 승인 → 서명 반환.","source":"../products/p01-device-firmware/use-cases.md"},"P01.UC3":{"title":"폰 분실과 대여 반납","criteria":"교체 커밋 직전/직후 전원 차단 및 옛 본드 삭제 실패를 주입한다. 재시작 후 활성 소유 세대는 하나이고 교체 완료 후 구세대 서명은 0건이다. 대여 종료 이력과 개인 슬롯 불변도 대조한다.","behavior":"보드 PIN과 등록한 독립 복구 수단으로 새 앱 공개키를 확인한다. 소유 세대 증가와 이전 앱 권한·대기 승인 무효화를 한 번에 저장한 후 옛 BLE 본드를 정리한다. 반납은 대여 정산 상태 확인 후 대여 영역을 닫는다.","source":"../products/p01-device-firmware/use-cases.md"},"P01.UC4":{"title":"읽기 전용 내보내기와 공동 서명","criteria":"독립 구현의 파생 주소 대조, 위장 change 거절, DApp 연결 해제 뒤에도 기존 온체인 allowance가 유지되고 철회 거래 확정 후에만 줄어드는 기록.","behavior":"계정 범위와 주소 연결 가능성을 확인하고 xpub 내보내기를 승인한다. 읽기 전용 앱의 PSBT를 가져와 입력·외부 출력·자기 거스름돈·공동서명 정책·수수료를 기기에서 검증하고 해당 서명만 반환한다.","source":"../products/p01-device-firmware/use-cases.md"},"P02.R1":{"title":"설정·튜토리얼","criteria":"처음 사용자 테스트에서 보호자 없이 첫 테스트 결제를 완료하고 큰 글씨 200%·색상 없이도 거절할 수 있다.","behavior":"보드 등록, 보드 PIN 설정, 백업 확인, 데모 자산 첫 송금을 단계별 안내한다. 건너뛰기·다시 보기와 화면 읽기를 지원한다.","source":"../products/p02-user-app/prd.md"},"P02.R2":{"title":"지갑·자산","criteria":"Bitcoin·Ethereum·Solana·XRPL·Base·StableNet 각각 수신·송금·거절 시험, 잔액과 수수료 단위 일치.","behavior":"계정과 네트워크를 명시하고 수신 QR·주소, 잔액·내역·수수료, 보내기와 상태 조회를 제공한다.","source":"../products/p02-user-app/prd.md"},"P02.R3":{"title":"네트워크 관리","criteria":"잘못된 체인 ID/RPC 조합을 거부하고 메인넷·테스트넷 자산 합산 0건.","behavior":"체인·토큰 선택, 테스트넷 전환, 같은 엔진의 커스텀 네트워크·RPC 추가, 미지원 엔진 차단을 제공한다.","source":"../products/p02-user-app/prd.md"},"P02.R4":{"title":"DApp 브라우저","criteria":"연결만으로 서명 0건. 만료/출처 변경 후 재승인, 권한 철회 뒤 새 요청 거부.","behavior":"내장 브라우저와 WalletConnect 연결 요청에서 출처와 권한을 보여주고 접속, SIWE 등 로그인 메시지, 거래·토큰 승인, 세션 해제를 각각 처리한다.","source":"../products/p02-user-app/prd.md"},"P02.R5":{"title":"구독","criteria":"알림 2개/폰 2대에도 한 회차 지급 최대 1건. 미승인 회차 지급 0건, 해지 후 미래 청구 0건.","behavior":"약관·회차·금액·기한을 보여주고 알림이나 미결 목록에서 해당 청구서를 열어 매회 보드로 승인한다.","source":"../products/p02-user-app/prd.md"},"P02.R6":{"title":"매장·여행","criteria":"예약금 10과 잔금 20인 총액 30 주문에서 누계 30, 위치·푸시 거부 상태에서도 수동 검색·진행 가능.","behavior":"지도 검색, 시간대·인원 예약, 디파짓과 잔금, 미리 주문, 픽업·영수증·환불 조회를 제공한다.","source":"../products/p02-user-app/prd.md"},"P02.R7":{"title":"표시·분실 대응","criteria":"폰 화면만 있는 고위험 요청은 거절되고, 새 폰 등록 후 구 폰 본드로 승인 0건.","behavior":"기기 계산 요약과 실제 지급 대상·체인·수수료를 표시한다. 신뢰 경로가 필요한 거래를 정책에 따라 차단하고 폰 교체/분실 복구를 안내한다.","source":"../products/p02-user-app/prd.md"},"P02.R8":{"title":"계정·공개정보·보호 설정","criteria":"숨긴 자산을 다시 표시해도 확정 잔액·미결 거래 참조가 같고 오프라인 시세에는 캐시 시각이 남는다. 숨긴 계정을 원래 경로에서 복구한다. 읽기 전용 프로필 서명 0건, 폰 단독으로 한도 상향 0건.","behavior":"계정 재발견, 주소록, 계약별 자산 검색·즐겨찾기·숨김·재표시, 토큰 단위와 환산 시세의 출처·통화·갱신 시각 확인, 읽기 전용 내보내기와 허용목록 변경을 제공한다.","source":"../products/p02-user-app/prd.md"},"P02.R9":{"title":"단말과 계정 유지관리","criteria":"업데이트 중단 후 실행 버전을 대조하고 미결 지급을 다시 조회한다. 진단 미리보기에 PIN·시드가 없고 탈퇴 시 자산 이동 0건.","behavior":"배포 프로필과 실행 버전을 확인하고 충돌 작업을 표시한다. 진단 내용을 공유 전에 보여준다. 계정 로그아웃·탈퇴·개인 슬롯 초기화를 구분한다.","source":"../products/p02-user-app/prd.md"},"P02.UC1":{"title":"초기 설정과 네트워크 전환","criteria":"기기 교체·테스트넷 전환 화면 및 6체인 수신 벡터.","behavior":"프로필 선택 → 튜토리얼 → 보드 등록 → 보드 PIN → 복구 확인 → 체인·자산 선택 → 수신 주소 확인.","source":"../products/p02-user-app/use-cases.md"},"P02.UC2":{"title":"DApp 접속·로그인·지출","criteria":"연결만으로 서명 0건, 철회 뒤 서명 0건.","behavior":"브라우저 → 연결 범위 동의 → 로그인 내용 검토 → 별도 지출 요청·보드 승인 → 영수증 조회.","source":"../products/p02-user-app/use-cases.md"},"P02.UC3":{"title":"회차 알림과 해지","criteria":"두 폰·알림 거부·기한 경과와 미승인 지급 0건.","behavior":"미결 목록 또는 알림 → 회차·상점 확인 → 가맹점 서명 견적 원본을 소유자 세션의 `pay.prepare`로 중계 → 지급자·회차·견적 해시 검증과 보드 승인 → 거래 조회 → 다음 회차 해지.","source":"../products/p02-user-app/use-cases.md"},"P02.UC4":{"title":"여행지 예약·디파짓·픽업","criteria":"총액 30에서 10+20 대사, 취소 결과와 실제 환불 상태를 각각 표시.","behavior":"지도 → 장소 → 시간·재고 → 총액/취소 조건 → 디파짓 승인 → 예약 상세에서 잔금·픽업 확인.","source":"../products/p02-user-app/use-cases.md"},"P02.UC5":{"title":"계정 재발견과 공개 범위 검토","criteria":"복원 전후 주소 일치, 숨김 전후 확정 잔액·미결 참조 동일, 오프라인 환산 표시의 예시값·캐시 시각, 거절 시 공개정보 전달 0건, 읽기 전용 프로필 서명 0건.","behavior":"숨긴 계정 재발견 → 네트워크·주소 유형·계정 범위 선택 → 기준 주소 대조 → 계정 표시 → 같은 체인·계약의 자산을 즐겨찾기하고 숨긴 뒤 재표시 → 환산 시세의 통화·출처·시각 확인 → 읽기 전용 내보내기의 외부·거스름돈 범위 동의 → 기기 확인.","source":"../products/p02-user-app/use-cases.md"},"P02.UC6":{"title":"업데이트 중단과 진단 자료 확인","criteria":"재부팅 후 실행 버전, 원래 미결 주문 조회 키, PIN·시드가 없는 공유 미리보기를 대조한다.","behavior":"설정 → 기기 → 실행 버전·배포 서명·전원 확인 → 독점 작업 종료 → 기기 물리 확인 → 재부팅 후 버전 대조 → 진단 항목 미리보기.","source":"../products/p02-user-app/use-cases.md"},"P03.R1":{"title":"생성·연계","criteria":"중복 요청은 공개 계정 하나, 일부 참여자 실패 시 활성 주소 0개.","behavior":"인증 이후 별도 사용자 증명으로 생성 세션을 예약하고 분산 키 생성(DKG) 완료 후 공개키를 활성화한다.","source":"../products/p03-cloud-mpc-wallet/prd.md"},"P03.R2":{"title":"일상 서명","criteria":"한 참여자나 로그인 토큰만으로 서명 0건. 결과를 공유해도 완전 개인키 노출 0건.","behavior":"허용된 지갑·체인·원문·세대(epoch)·만료를 모바일 별도 승인에 결합한다. 각 참여자는 격리 환경에서 임계 서명한다.","source":"../products/p03-cloud-mpc-wallet/prd.md"},"P03.R3":{"title":"복구·갱신","criteria":"구세대 재시도·신구 혼용은 거부, 교체 전후 공개키를 유지하는 프로필은 같은 주소로 검증.","behavior":"독립 복구 확인과 정책상 대기 후 이전 세대를 차단하고 새 참여자 집합의 활성 영수증을 수집한다.","source":"../products/p03-cloud-mpc-wallet/prd.md"},"P03.R4":{"title":"계정 수명주기","criteria":"두 동시 해제에서 마지막 수단이 보존되며 탈퇴 요청이 보드 키나 외부 자산을 움직인 사례 0건.","behavior":"서비스 장애, 휴대폰 분실, 소셜 연계 해제, 탈퇴를 구분하고 마지막 인증수단 제거를 직렬화한다.","source":"../products/p03-cloud-mpc-wallet/prd.md"},"P03.UC1":{"title":"클라우드 계정 만들기","criteria":"중복 요청 두 건에 원 계정 수와 활성 주소 수 대조.","behavior":"독립 인증 → 생성 요청 저장 → 참여자 DKG → 공개키 대조 → 계정 표시.","source":"../products/p03-cloud-mpc-wallet/use-cases.md"},"P03.UC2":{"title":"거래 서명","criteria":"공개키로 서명 검증, 탈취 로그인만 주어진 시험에서 서명 0건.","behavior":"앱에서 원문·수수료 검토 → 개별 승인 → A/B 라운드 → 결과 서명 검증 → 제출자 반환.","source":"../products/p03-cloud-mpc-wallet/use-cases.md"},"P03.UC3":{"title":"분실 휴대폰 교체","criteria":"서비스 참여자가 구세대 라운드를 거절한 기록, 새 폰으로 1회 서명, 감사 기록.","behavior":"복구 접수 → 새 서명 차단 → 독립 승인 → 참여자 교체 → 새 세대 활성 확인 → 잠금 해제.","source":"../products/p03-cloud-mpc-wallet/use-cases.md"},"P03.UC4":{"title":"서비스 중단 또는 정족수 유출","criteria":"B 중단 시 검증되지 않은 A+C 서명 0건, 침해 신고를 일반 refresh 성공으로 종결한 사례 0건.","behavior":"장애와 침해를 분류하고 A+C의 독립 경로를 미리 채택·인수한 조합에서만 그 정책으로 복구한다. 미검증 조합은 서비스 복구 대기와 마지막 확인 상태를 제공한다.","source":"../products/p03-cloud-mpc-wallet/use-cases.md"},"P04.R1":{"title":"모드·메뉴","criteria":"결제 모드에서 메뉴 편집 불가, 진행 중 매매는 모드 전환 뒤에도 조회 가능.","behavior":"관리자 설정으로 메뉴/옵션/장바구니가 있는 키오스크 또는 외부 주문 금액만 받는 결제 모드를 선택한다.","source":"../products/p04-merchant-kiosk/prd.md"},"P04.R2":{"title":"병렬 주문","criteria":"한 손님이 5분간 메뉴를 봐도 다른 손님이 먼저 완료. 동시 주문 100건에서 타인 주문 노출·음수 재고 0건.","behavior":"손님마다 독립 세션·장바구니·픽업 번호를 발급하고 P05에서 재고를 예약한다. 전화 데이터가 없으면 온라인 단말이 BLE 요청을 중계한다.","source":"../products/p04-merchant-kiosk/prd.md"},"P04.R3":{"title":"QR·BLE","criteria":"QR과 BLE로 20회 중복 제출해도 같은 주문에 한 번 지급. RSSI는 탐색 보조로만 사용.","behavior":"매장·단말·주문·금액을 표시하고 한 지급자로 결합한 견적만 승인에 쓴다. 동적 POS QR은 결합 전 미리보기다.","source":"../products/p04-merchant-kiosk/prd.md"},"P04.R4":{"title":"조회·픽업","criteria":"응답 유실·앱 재기동에도 중복 조리·영수증·재청구 0건.","behavior":"제출 해시를 저장하고 P07은 체인 확정 증거를 제공한다. P05가 주문·회계·이행 outbox를 한 트랜잭션으로 기록한 뒤 발행한 이행 eventId만 단말 inbox에 한 번 반영해 조리·픽업을 갱신한다. 재접속은 원거래부터 조회한다.","source":"../products/p04-merchant-kiosk/prd.md"},"P04.R5":{"title":"데모 운영","criteria":"다른 네트워크·토큰을 고르면 승인 단계에 진입하지 않는다.","behavior":"StableNet 테스트넷 지정 토큰만 허용하고 체인·자산·매장·가격·수수료를 사전 표시한다.","source":"../products/p04-merchant-kiosk/prd.md"},"P04.R6":{"title":"점주 현장 운영","criteria":"권한 없는 점원은 환불 승인·타 지점 조회 불가. 재원 부족은 접수/지급 대기로 표시하고 확정 영수증을 내지 않는다.","behavior":"점주 로그인 후 지점 매출·정산·환불 내역을 조회하고 원주문에서 허용된 환불을 신청한다. 재원·승인·마감은 P05가 처리한다.","source":"../products/p04-merchant-kiosk/prd.md"},"P04.UC1":{"title":"공용 단말과 근거리 고객 동시 주문","criteria":"100개 주문 부하에서 소유자·재고·번호 대조, A보다 B가 먼저 완료.","behavior":"B가 매장 선택 → BLE로 메뉴 조회 → B 재고 예약 → 개별 견적 승인 → B 픽업 번호 발급. A는 탐색 계속.","source":"../products/p04-merchant-kiosk/use-cases.md"},"P04.UC2":{"title":"결제 전용 POS의 QR/BLE 경쟁","criteria":"20회 중복 제출과 데모 허용목록 외 토큰 시험.","behavior":"단말이 QR 미리보기 표시 → 고객 후보 접속 → 지급자 한 명 선택 → 서버가 서명 가능 견적을 먼저 기록 → 해당 폰/보드 승인.","source":"../products/p04-merchant-kiosk/use-cases.md"},"P04.UC3":{"title":"제출 결과 유실 뒤 영업 재개","criteria":"재시작 전후 거래·조리 ID 대조.","behavior":"저장한 주문·해시 조회 → P05/P07 대사 결과 조회 → P05가 원장과 함께 커밋한 이행 eventId 수신 → 단말 inbox에서 중복 제거 후 조리/영수증 전달.","source":"../products/p04-merchant-kiosk/use-cases.md"},"P04.UC4":{"title":"관리자 모드 전환과 점주 환불","criteria":"모드 전환 도중 재기동 후 지급 누락 0건, 과거 영수증 조회 가능, 권한 없는 환불 0건.","behavior":"신규 메뉴 주문을 차단하고 기존 주문 ID·조회 담당 인계를 확인한다. 관리자가 결제 전용 설정을 배포하고 단말의 설정 버전 ACK 뒤 전환 완료로 표시한다. 점주는 지급된 원주문에서 환불을 신청하고 P05의 접수·확정 결과를 조회한다.","source":"../products/p04-merchant-kiosk/use-cases.md"},"P05.R1":{"title":"등록·권한","criteria":"점원이 지급 주소를 변경할 수 없고 견적에 묶인 주소·버전과 결제 시 유효한 등록 주소가 일치해야 한다. 불일치는 거절하고 기발급 견적의 지급·만료·무효화 확인 후 새 견적에 재동의를 받는다.","behavior":"가맹점·지점·단말·직원 역할을 분리하고 지급 주소 소유 증명·이중 승인·대기시간·변경 통지를 기록한다.","source":"../products/p05-operations-backoffice/prd.md"},"P05.R2":{"title":"메뉴·예약·가격","criteria":"마지막 재고 1개 동시 요청 중 1개만 성공, 확정 견적이 조용히 재가격되는 사례 0건.","behavior":"게시 버전, 옵션·세금·할인·재고·시간대·예약 인원과 총액을 최소 단위 정수로 계산한다.","source":"../products/p05-operations-backoffice/prd.md"},"P05.R3":{"title":"주문·견적·릴레이","criteria":"반환 직후 장애에도 견적 재조회 가능, 재시도·워커 중복에도 지급·재고·조리 최대 1회.","behavior":"수권된 발급자가 지급자·nonce·계약 버전·금액·기한을 묶은 견적을 내구 저장한 후 반환한다. QR·BLE·POS에 같은 상태 원장을 제공한다.","source":"../products/p05-operations-backoffice/prd.md"},"P05.R4":{"title":"구독·예약금","criteria":"중복 알림 지급 최대 1건, 예약 30 중 10 입금 후 잔금은 20. 만료 전 결제 가능성이 남으면 재고 보존.","behavior":"구독/회차와 예약/디파짓/잔금 ID를 연결한다. 해지는 미래 회차를 닫고 이미 발행된 지급은 추적한다.","source":"../products/p05-operations-backoffice/prd.md"},"P05.R5":{"title":"정산·환불","criteria":"일마감 차이 0 최소 단위 또는 추적 가능한 예외. 주소 변경·대여 종료 뒤에도 환불 경로를 검증한다.","behavior":"등록 주소 직접 입금 증거와 주문 원장·체인·P07을 맞춘다. 환불은 별도 승인·재원·거래를 가지며 부분 합계가 원금을 넘지 않는다.","source":"../products/p05-operations-backoffice/prd.md"},"P05.R6":{"title":"운영·감사","criteria":"조리 중복 0건, 타 지점 개인정보 접근 거절, 누가 무엇을 수정·재처리했는지 추적 가능.","behavior":"점주, 점원, 대사 담당, 대여 운영자의 권한을 분리한다. 확정 후 outbox로 조리·영수증·POS 통지, webhook 재전송과 운영 조회를 제공한다.","source":"../products/p05-operations-backoffice/prd.md"},"P05.R7":{"title":"기존 대여·운영","criteria":"v1 대여 개설부터 반납/잔액 인출·지연 지급 조회까지 회귀하고 운영자 명령으로 개인 키나 v2 재원이 바뀐 건수 0.","behavior":"운영자가 기기 attestation, 대여 개설·예치·한도와 인증 시각, 반납·인출 가능 여부를 확인한다. FOTA 캠페인은 모델·버전·회수 상태에 묶고 대상별로 재개한다.","source":"../products/p05-operations-backoffice/prd.md"},"P05.UC1":{"title":"가격 게시와 지점 운영","criteria":"두 지점·두 메뉴 버전의 합계와 감사 이력. 점장이 한 지점의 음료에 필수 항목명 ‘온도’와 선택지 ‘아이스·따뜻하게’를 게시하고, 베이커리에 원재료 ‘밀·우유·달걀’ 및 설비에서 접촉 가능한 성분 ‘견과류’를 별도로 신고한다. 해당 지점의 고객 화면과 다른 지점의 독립 메뉴를 각각 조회한다. 다음 게시에서 선언을 바꿔도 앞서 접수된 주문 금액·메뉴 버전은 유지돼야 한다.","behavior":"편집본 생성 → 옵션·합계 검증 → 버전 게시 → 새 주문에 반영. 지급 주소 변경은 소유 증명과 두 승인 후 예약.","source":"../products/p05-operations-backoffice/use-cases.md"},"P05.UC2":{"title":"예약·회차 견적 후 고객 이탈","criteria":"방송 응답 유실 및 만료 직전 포함 시험에서 이중 재고·지급 0건.","behavior":"재고/회차 예약 → DB에서 견적 저장 → 폰 전달 → 기존 주문 조회 → 확정 결과 반영.","source":"../products/p05-operations-backoffice/use-cases.md"},"P05.UC3":{"title":"부분 환불과 일마감","criteria":"원금 30에서 20+20 경합 시 최대 30, 중복 통지에도 같은 환불 ID.","behavior":"누적 가능액 예약 → 승인·재원 확인 → 환불 제출 → 확정 관측 → 장부·영수증 반영.","source":"../products/p05-operations-backoffice/use-cases.md"},"P05.UC4":{"title":"지점 마감과 동시성 복구","criteria":"두 지점의 접근·CSV 합계, 다음날 환불 일자, 중복 이행 0건과 부하/복구 시간 기록.","behavior":"주문 100개 동시 처리 → 확정 지급·환불을 실제 발생 영업일별 집계 → 권한 있는 지점만 CSV 내보내기 → P07 증거·등록 주소 잔액과 대조.","source":"../products/p05-operations-backoffice/use-cases.md"},"P05.UC5":{"title":"대여 개설·반납과 FOTA 캠페인","criteria":"대여 계약 입출금 합계·반납 세대·미결 주문 대조, 지원 외 모델 업데이트 거절. [반납 경로](../../../specifications/return-route-contracts.md)","behavior":"기기 확인 → 대여 전용 계정 개설·예치/한도/시각 확인 → 미결 지급 대사 → 반납/인출 상태 확정 → 대여 기기 정리. 캠페인은 지원 리비전에만 배포하고 적용 전 승인 대기를 정리한다.","source":"../products/p05-operations-backoffice/use-cases.md"},"P06.R1":{"title":"거래 도메인","criteria":"다른 도메인의 서명·만료·기사용 주문은 잔액 변화 없이 거절.","behavior":"체인·계약·토큰·상점·주문·지급자·금액·기한·nonce와 견적에 결합한 지급 주소·버전을 현재 유효한 등록 정보와 대조한다. 주소 변경 시 옛 견적의 수취인을 조용히 바꿔 실행할 수 없다.","source":"../products/p06-stablenet-contracts/prd.md"},"P06.R2":{"title":"직접 지급","criteria":"지급 30이면 주소의 사용 가능한 잔액 증가 30. 성공을 반환하고 미이체하는 토큰도 revert, 상태·토큰 이동 원복.","behavior":"주문 소비와 등록 수취 주소로의 정확한 이전을 한 트랜잭션에서 처리하고 실제 가용 잔액 증가를 확인한다.","source":"../products/p06-stablenet-contracts/prd.md"},"P06.R3":{"title":"이벤트·환불","criteria":"부분·전체 환불 후 누적액 ≤ 원금. 체인 확정 전 매장 영수증을 완료로 판정하지 않는다.","behavior":"버전·주문·수취 주소·금액으로 지급을 식별한다. 원결제에 연결한 별도 재원/권한의 환불에서 누적 한도를 검증한다.","source":"../products/p06-stablenet-contracts/prd.md"},"P06.R4":{"title":"배포·공존","criteria":"v1 잔액과 v2 재원 간 무단 이동 0건, 같은 업무 주문의 동시 지급 방지는 P05의 버전 결합과 통합 검증.","behavior":"8283 지정 TestUSDC와 계약 버전을 manifest로 고정한다. v1 적립금/인출을 계속 대사하고 새 버전에 독립 재원을 둔다.","source":"../products/p06-stablenet-contracts/prd.md"},"P06.UC1":{"title":"지정 상점으로 지급","criteria":"호출 전후 주문 사용 여부, 지급자·수취인 잔액, 이벤트 수.","behavior":"도메인·만료·잔액 검사 → 주문 소비 → 등록 주소 이전 → 순증 검증 → 지급 이벤트.","source":"../products/p06-stablenet-contracts/use-cases.md"},"P06.UC2":{"title":"두 부분 환불","criteria":"원금 30의 10+20 허용, 다음 1 거절. 환불 재원과 수취 잔액 대조.","behavior":"서로 다른 refundId 제출 → 원금/누계 검증 → 금액 반환 → 환불 이벤트.","source":"../products/p06-stablenet-contracts/use-cases.md"},"P06.UC3":{"title":"v1/v2 공존","criteria":"구·신 계약 주소별 동일 기간 대사와 주문 중복 검사.","behavior":"v1 대여 개설·예치·한도·지연 인출·반납 및 기존 가맹점 cashOut 대조 → 별도 v2 테스트 예치와 가맹점 가스 확인 → 등록된 새 도메인에서 새 주문 지급.","source":"../products/p06-stablenet-contracts/use-cases.md"},"P07.R1":{"title":"대상·커서","criteria":"페이지 중간 강제 종료·중복 로그에도 같은 확정 이벤트 집합을 산출한다.","behavior":"P10 manifest의 체인·주소·ABI·시작 높이를 기준으로 수집하고 이벤트와 커서를 함께 기록한다.","source":"../products/p07-indexer/prd.md"},"P07.R2":{"title":"확정·재구성","criteria":"제거된 미확정 이벤트가 확정 영수증에 남는 건수 0, 확정 가정 위배는 사고 상태로 승격.","behavior":"관측 블록의 해시·부모와 체인별 확정 정책을 검사한다. 비정상 분기·노드 불일치는 마지막 공통 지점부터 정합성을 복구한다.","source":"../products/p07-indexer/prd.md"},"P07.R3":{"title":"영수증 조회","criteria":"두 매장의 같은 주문 번호가 섞이지 않고 조회 없음·동기화 지연·확정 지급을 구분한다.","behavior":"가맹점·주문·체인·계약 버전별 지급, 부분 환불과 최신 관측 높이를 반환한다. 기존 v1 조회를 유지하고 읽기 전용 탐색 화면에 검색·검증 블록·확정도·최신성 및 조회 권한을 제공한다.","source":"../products/p07-indexer/prd.md"},"P07.R4":{"title":"대사·재생","criteria":"독립 재색인과 원장 이벤트 총액 일치. 중복 전달은 추가 이행 0건.","behavior":"원시 체인 식별자와 증거를 P05에 전달하고 체크포인트부터 재생한다. 업무상 취소·조리 결정은 P05가 수행한다.","source":"../products/p07-indexer/prd.md"},"P07.UC1":{"title":"지급·환불 내역 찾기","criteria":"두 매장 같은 주문 ID와 부분 환불 벡터.","behavior":"지급 로그 수집 → 확정 정책 확인 → 대응 환불 연결 → 조회 결과와 높이 반환.","source":"../products/p07-indexer/use-cases.md"},"P07.UC2":{"title":"분기와 노드 장애 복구","criteria":"제거된 블록 로그 0건, 중복 확정 0건, 재개 커서 기록. 조회 전환 도중 응답을 잃으면 같은 작업 ID로 결과를 조회하고, 실제 대상·기대 revision·감사 주체가 일치하기 전에 ‘전환 완료’를 표시하지 않는다.","behavior":"수집 보류 → 공통 블록 조회 → 미확정 투영 철회 → 새 분기 재생 → 확정 결과 비교.","source":"../products/p07-indexer/use-cases.md"},"P07.UC3":{"title":"늦은 지급 재대사","criteria":"만료 직전 포함·이후 확정이 만료로 분류되는 사례 0건.","behavior":"원 계약·주문으로 조회 → 만료 경계를 포함하는 확정 범위까지 동기화 → 포함 시각과 확정 증거 전달.","source":"../products/p07-indexer/use-cases.md"},"P08.R1":{"title":"교환·유동성","criteria":"유효 범위 밖 가격에서는 실행 0건. 중단 후 같은 해시를 조회해 중복 포지션 생성 0건.","behavior":"AMM 경로, 수수료, 최소 수령/최대 지급과 기한을 보여주고 LP 추가·제거 시 예상 지분과 실제 결과를 대조한다.","source":"../products/p08-market-services/prd.md"},"P08.R2":{"title":"TEST FX","criteria":"기간 만료 또는 역방향 혼동을 거절하고 재견적에 사용자 재동의를 받는다.","behavior":"통화쌍·방향·소수 단위·가격 시각·기한을 명시하고 한 견적에 한 실행만 연결한다.","source":"../products/p08-market-services/prd.md"},"P08.R3":{"title":"무기한 포지션","criteria":"같은 기간 펀딩 중복 0건, 청산과 사용자 청산 방지 주문 경합에서 이중 정산 0건.","behavior":"증거금·방향·한도·가격 기준, 펀딩 시점·예상 청산 조건을 표시하고 포지션별 이력을 남긴다.","source":"../products/p08-market-services/prd.md"},"P08.R4":{"title":"가격·keeper 운영","criteria":"오래된 가격으로 신규 위험 증가나 자동 청산 0건. 정상화 후 재개 근거와 정산 이력을 조회.","behavior":"가격 출처와 신선도·이상 상태를 검증하고 keeper 작업을 멱등 실행한다.","source":"../products/p08-market-services/prd.md"},"P08.UC1":{"title":"교환·LP 입출금","criteria":"슬리피지 범위와 LP 추가·제거 전후 잔액 대조.","behavior":"예상 수령/지분 검토 → 한도·기한 동의 → 지갑 승인 → 실행 → 실제 수령·지분 확인.","source":"../products/p08-market-services/use-cases.md"},"P08.UC2":{"title":"모의 환전 재견적","criteria":"역방향·소수점·만료·중복 벡터.","behavior":"방향·기준 가격 확인 → 유효 견적 승인 → 결과 수량 확인.","source":"../products/p08-market-services/use-cases.md"},"P08.UC3":{"title":"펀딩·청산 경합","criteria":"동일 keeper 작업 두 번과 사용자 동시 종료 시 이중 정산 0건.","behavior":"가격·정책·포지션 revision과 펀딩 cursor 확인 → 작업 키와 제출할 해시 영속화 → 시장 계약 제출 → 계약에서 동일 기간/포지션 상태 한 번 소비 → 정규 체인 이벤트와 포지션 대조.","source":"../products/p08-market-services/use-cases.md"},"P09.R1":{"title":"장소 검색","criteria":"위치 접근 거절 뒤에도 수동 검색→예약 가능, 지도·목록이 같은 장소 ID를 연다.","behavior":"맛집·명소를 지도/목록·지역 직접 검색·필터로 탐색하고 영업시간·예약 가능 시각·정보 갱신 시각을 표시한다.","source":"../products/p09-travel-ai/prd.md"},"P09.R2":{"title":"예약·미리 주문","criteria":"마지막 좌석 경합에 1건만 확정, 예약금 10·잔금 20을 한 예약 총액 30으로 추적.","behavior":"P05에서 재고/시간대·취소 조건·금액을 조회해 예약금·잔금·픽업을 연결한다. P02에서 지갑 승인을 수행한다.","source":"../products/p09-travel-ai/prd.md"},"P09.R3":{"title":"영수증 기반 후기·보상","criteria":"재제출로 동일 보상 추가 0건, 환불·자격 철회 시 사유와 조정 이력 추적.","behavior":"검증된 영수증의 사용 자격, 후기·챌린지/스탬프의 중복과 환불 정책을 확인한다.","source":"../products/p09-travel-ai/prd.md"},"P09.R4":{"title":"발자취·음성·AI","criteria":"동의 철회 후 신규 수집/AI 전송 0건. 삭제가 원본·전사·파생물·처리 대기열에 전파된 결과 확인.","behavior":"위치 기록·녹음·전사/요약·추천 제공의 목적과 보유 기간을 보여주고 개별 동의·열람·삭제를 제공한다.","source":"../products/p09-travel-ai/prd.md"},"P09.R5":{"title":"AI 코스와 따라하기","criteria":"생성 결과만으로 예약·지출 0건. 생성 중 편집한 일정을 덮어쓰지 않고, 검증되지 않은 방문 보상 0건.","behavior":"후보 장소의 영업시간·이동 가능성·예산·출처를 검증하고 사용자가 자신의 일정에 적용한다. 따라하기 챌린지는 동의한 방문 근거로 진행한다.","source":"../products/p09-travel-ai/prd.md"},"P09.UC1":{"title":"위치 거부 후 명소 예약","criteria":"마지막 한 자리 동시 예약 및 총액 30 중 10 결제 결과.","behavior":"지도 또는 목록 검색 → 같은 장소 상세 → 시간·인원 선택 → P05 가격/취소 조건 확인 → P02에서 디파짓 승인 → 예약 상세 복귀.","source":"../products/p09-travel-ai/use-cases.md"},"P09.UC2":{"title":"영수증 후기와 스탬프","criteria":"테스트넷 영수증의 실구매 배지·실혜택 0건, 혜택 확정 전 보류, 환불 후 조정 기록, 공개 후기에서 지갑 주소 배제.","behavior":"증거의 장소·본인·유형을 확인해 일반/테스트 후기와 실구매 배지를 구분한다. 실구매 배지에는 검증된 실제 지급과 이용·이행 근거가 필요하다. 사용자가 게시에 동의하면 챌린지 조건을 확인하고 혜택 원장의 확정 효과를 조회한다.","source":"../products/p09-travel-ai/use-cases.md"},"P09.UC3":{"title":"여행 기록 삭제","criteria":"철회 시점 이후 생성 0건, 기기·서버·공급자 삭제 결과와 주문 영수증 분리.","behavior":"목적별 철회 → 신규 수집 차단 → 원본·전사·추천 파생물 삭제 요청 → 처리 상태 확인.","source":"../products/p09-travel-ai/use-cases.md"},"P09.UC4":{"title":"좌석 예약 없이 미리 주문하기","criteria":"좌석 예약 0건, 조건 변경 재동의 전 신규 접수·지급 0건, 원주문 재조회에 추가 지급 0건. 지급 확정과 매장 접수 전 번호 미표시, 앱 재시작·지도 장애 뒤 동일 번호, 이행 불가 시 원주문에 연결된 환불 증거.","behavior":"지점·시간·옵션 선택 → 현재 메뉴 조건 확인과 P05 주문 접수 → 원견적 검토·보드 승인·사용자 제출 → P07 지급 확정 확인 → 매장 이행 접수 → 원주문의 픽업 번호 표시.","source":"../products/p09-travel-ai/use-cases.md"},"P09.UC5":{"title":"AI 코스 적용과 따라하기","criteria":"휴무·예산 초과 후보 표시, 뒤늦은 결과의 편집본 덮어쓰기 0건, 자동 예약·지출 0건.","behavior":"후보와 출처 조회 → 영업시간·이동·예산 검사 → 미확인 장소 표시 → 사용자가 후보를 자신의 일정에 적용 → 선택한 챌린지에서 검증된 방문 진척 확인.","source":"../products/p09-travel-ai/use-cases.md"},"P10.R1":{"title":"공통 스펙·배포","criteria":"동일 벡터의 프레임·직렬화 바이트 일치, 앱/펌웨어 빌드가 참조한 버전을 manifest로 역추적 가능.","behavior":"별도 버전의 스키마·생성기·C/TS/Go/Python 산출물을 제공하고 P01/P02/P04가 같은 릴리스에서 import한다.","source":"../products/p10-platform/prd.md"},"P10.R2":{"title":"역할·세션","criteria":"소유자 앱과 가맹점 단말 양쪽의 `pay.prepare`가 같은 가맹점 서명 견적을 검증한다. 잘못된 역할·순서·구버전 강등은 거절. 분할·중복·재연결 시 다른 세션의 승인 0건.","behavior":"관리(폰↔보드), 지급(단말↔보드), 근거리 주문(폰↔단말)의 권한과 상태를 분리하고 협상·만료·재생·중복·조각 복구를 정의한다.","source":"../products/p10-platform/prd.md"},"P10.R3":{"title":"릴리스·보안","criteria":"영향받는 버전 확인→수정 버전 고정→재스캔→재현 빌드와 회귀→지원
