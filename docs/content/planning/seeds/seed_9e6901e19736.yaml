- 'The device signs exactly two EIP-712 types and refuses all others: PaymentAuthorization {chainId, contract,
  merchant, payout, token, amount, orderId, nonce, expiry} and LimitChange (PIN + button); it never signs
  a transaction, approve or Permit'
- 'Merchant trust: the operator (P05) issues EIP-712 merchant attestations (name, signing address, payout
  address, about 24h validity); the device holds the operator address written once at provisioning and
  hard-refuses unless attestation signer, order signer, payout and expiry check out; the device keeps
  time from an operator-signed time anchor written during rental setup (device.reset followed by setup;
  the target path is the renter''s phone setup app in P02, which is design-only this cycle, so the P05
  provisioning script delivers the same operator-signed time-anchor message over the BLE setup session
  and P05 design.md documents this substitute) and advanced by the on-chip RTC, so it deterministically
  refuses an expired attestation with ATTESTATION_EXPIRED; a new anchor is accepted only if signed by
  the provisioned operator address and not earlier than the last anchor; after power loss the anchor is
  invalid and the device refuses payments until re-anchored through the setup path; the contract (block.timestamp)
  and on-chain registry remain authoritative'
- 'Settlement: the operator calls depositFor(deviceAddress, amount, withdrawAddress) at rental; the deposit
  belongs to the renter (testnet custodial PoC); single token per deployment; the contract checks registry,
  signed payout == registry payout, per-payment and daily caps, unordered 256-bit device nonces, expiry,
  and uniqueness of (merchant, orderId) with ORDER_ALREADY_PAID; merchant proceeds are credited to a merchant
  balance and cashed out to the registered payout (delay only on payout change); refunds are out of scope
  this cycle'
- 'Key and account lifecycle: the key is generated on-device by TRNG at rental, never exported, no backup;
  a PIN is set at rental and re-confirmed for LimitChange; until the external SE lands the key is sealed
  in the TF-M secure partition (testnet waiver recorded in DF-02) with a firmware PIN retry counter; from
  week 8 the key is SE-wrapped; an SE swap is closeAccount then a new depositFor; at return the operator
  calls closeAccount (device address deactivated immediately, balance paid to the registered withdrawal
  address after the delay) and device.reset wipes the key; withdrawal and closeAccount are callable by
  the operator or permissionlessly but only pay out to the registered address'
- 'Paid and failure semantics: a finalized PaymentSettled(merchant, orderId) event decides paid, and a
  kiosk tx reverting with ORDER_ALREADY_PAID for the same orderId counts as success; the kiosk pays gas
  with a minimum-balance rule (busy below it), simulates with eth_call before submit, reports pre-submit
  refusal as refused with {ATTESTATION_EXPIRED, MERCHANT_REVOKED, OVER_CAP, NONCE_REPLAYED, MERCHANT_FORGED}
  and post-submit status=0 as failed with the tx hash; 10 s hard timeout from request transfer completion,
  then Checking — do not pay again with re-payment blocked; no automatic retry except same-signature rebroadcast'
- 'Gates: week 4 evidence (BR-01..BR-08, software-signer PaymentSettled on 8283, SE secp256k1 datasheet),
  week 6 in-board key real-hardware end-to-end as scope-cut trigger, week 8 external SE; cut order if
  week 6 fails: external SE, P07, delayed-withdrawal demo; the on-device merchant display is never cut'
- 'Parameters are exactly seven named constants recorded once in the DF-02 register as {value, unit} with
  value > 0: perPaymentCap, dailyCap, withdrawalDelay, payoutChangeDelay, authorizationExpiry, attestationValidity
  (fixed at 86400 s by the interview), kioskMinGasBalance (an estimate recorded with its provenance: estimated
  settle gas x the observed StableNet eth_gasPrice of 47,600 gwei x a stated payment-count margin, marked
  for re-measurement at the week-4 gate); the other values are decided when the register is written within
  these bounds: 0 < perPaymentCap <= dailyCap, 30 s <= authorizationExpiry <= 300 s (above the 10 s kiosk
  timeout), 600 s <= withdrawalDelay <= 604800 s, payoutChangeDelay >= 3600 s; one EOA per role (operator,
  registry admin, kiosk) on testnet with multisig/HSM on hold; firmware update is MCUboot wired serial
  recovery only, BLE DFU on hold, signing key held offline'
- Anti-exfil (req 10), dependency pinning (req 12) and genuine-device attestation (req 13) are design-only
  waivers recorded in DF-02; no personal data is collected (req 14)
- 'Evidence and redaction: raw evidence lives in a git-ignored path; files changed since the register
  baseCommit contain no 0x-prefixed 40-hex addresses or 64-hex hashes except files listed with a reason
  in the register redactionExemptions (the EIP-712 test vectors, which use public test-only EOAs); checksums
