ontology_schema:
  name: MerchantAuthenticatedPaymentSignerSpec
  description: 'The specification domain for the NU-54V-DK merchant-authenticated payment signer: the
    governing decision register and its amendments, the six buildable products and their four-document
    sets, the BLE/EIP-712 protocol contract between device, kiosk and settlement chain, the delivery gates
    and role split, and the week-12 acceptance evidence.'
  fields:
  - name: freeze_id
    type: string
    required: true
    description: Dated design-freeze identifier that governs a decision, e.g. DF-20260925-02 or the superseded
      DF-20260920-01
  - name: decision_register
    type: array
    required: true
    description: 'Records in design-freeze-checkpoint-02.json: DF-01 decisions D01..D19 and RR-DEC-01
      with disposition, old, new, reason, affectedFiles; new decisions N01..Nxx with value, requiredIn,
      mustContain and resolves (F1/F2/F3)'
  - name: products
    type: array
    required: true
    description: 'Product records: id P01-P10, tier (core, reduced, design-only), owner role, and whether
      it ships running code in the 12-week window'
  - name: document_set
    type: array
    required: true
    description: Per-product documents under docs/content/products/pNN/ (plan.md, srs.md, use-cases.md,
      design.md) that cite decision ids
  - name: protocol
    type: object
    required: true
    description: 'Normative wire contract: BLE GATT roles and characteristics, LESC pairing with NFC out-of-band
      handover, CBOR framing with length/sequence/digest, message flow, and the four response outcomes;
      the operator-signed time anchor message written during rental setup; proximityRef is recorded as
      a removed element'
  - name: device_signed_types
    type: array
    required: true
    description: 'Exactly two EIP-712 types: PaymentAuthorization {chainId, contract, merchant, payout,
      token, amount, orderId, nonce, expiry} and LimitChange; everything else is refused'
  - name: merchant_attestation
    type: object
    required: true
    description: 'Operator-signed EIP-712 attestation: merchant name, merchant signing address, payout
      address, validity window (about 24h, re-issued daily)'
  - name: settlement_rules
    type: object
    required: true
    description: 'Contract behaviour: depositFor pre-deposit, internal balance move emitting PaymentSettled,
      registry and payout enforcement, caps, unordered nonce set, order uniqueness (ORDER_ALREADY_PAID),
      contract-enforced expiry, delayed withdrawal and closeAccount to the registered address, merchant
      cash-out delay on payout change'
  - name: key_lifecycle
    type: object
    required: true
    description: On-device TRNG key at rental, non-exportable, no backup, PIN; TF-M sealed until the SE
      lands (waiver), SE-wrapped from week 8; SE swap via closeAccount + new depositFor; device.reset
      at return; rental setup after device.reset writes the operator-signed time anchor
  - name: refusal_reason_codes
    type: array
    required: true
    description: 'Pre-submit refusal codes and their rejecting layer: ATTESTATION_EXPIRED (device, against
      its operator-anchored RTC time), MERCHANT_REVOKED (contract), OVER_CAP (contract), NONCE_REPLAYED
      (contract), MERCHANT_FORGED (device and contract); device-only codes USER_REJECTED, UNSUPPORTED_TYPE,
      TIME_ANCHOR_MISSING are demonstrated at week 12, TIMEOUT and BAD_FRAME are test-only'
  - name: finality_rule
    type: string
    required: true
    description: A finalized PaymentSettled(merchant, orderId) event decides paid; ORDER_ALREADY_PAID
      for the same orderId counts as success; P07 is not on the paid-decision path
  - name: latency_budget
    type: object
    required: true
    description: Single 10 s hard timeout measured from completion of the request transfer to the device,
      including the human button press; numeric p95 target deferred to weeks 5-6
  - name: gates
    type: array
    required: true
    description: 'Delivery gates: week 4 evidence gate (board BR-01..BR-08, software-signer PaymentSettled,
      SE datasheet secp256k1), week 6 in-board key scope-cut trigger, week 8 external SE'
  - name: cut_list
    type: array
    required: true
    description: 'Pre-agreed scope cuts if the week-6 gate fails, in order: external SE, P07, delayed-withdrawal
      demo; the on-device merchant display is never cut; cutting P07 turns the P07 receipt acceptance
      item into its substitute evidence'
  - name: wbs
    type: object
    required: true
    description: Regenerated 12-week WBS for DF-02 in product-worklist-and-12week-wbs-02.{csv,md}, limited
      to the six buildable products; each row has one owner among the user, role A and role B, per-owner
      weekly effort within recorded available days, week 4 shortened by Chuseok
  - name: acceptance_items
    type: array
    required: true
    description: Week-12 log items W12-01..W12-12 (seven functional, five security) with the evidence
      artifact each requires; each item flags whether it is conditional on a cut-list item and names its
      substitute evidence (only the P07 receipt is conditional)
  - name: evidence_policy
    type: object
    required: true
    description: 'Raw evidence in a git-ignored path; docs/content/ holds redacted copies with shortened
      hashes and addresses plus sha256: checksums; test-only EOAs'
  - name: risks
    type: array
    required: true
    description: 'Recorded risks: operator key as single point of failure, custodial deposits, unaudited
      larger contract, TF-M-only key protection until the SE lands, revoked merchant undetectable on the
      offline device, unverified NFC antenna and driver, Chuseok-shortened week 4, user carrying bring-up
      and contract work together'
  - name: freeze_scope
    type: object
    required: true
    description: 'Register verification scope: baseCommit fixed at register creation, staleLiterals as
      regexes, exemptPaths derived from the DF-01 artifact list plus seeds/ and design-history/, redactionExemptions
      with path and reason'
  - name: banner_record
    type: array
    required: true
    description: 'Per bannered file: path, bannerLine naming DF-20260925-02, baseSha256 (sha256:<64 hex>)
      of the file at baseCommit'
  - name: parameters
    type: object
    required: true
    description: 'Seven named constants perPaymentCap, dailyCap, withdrawalDelay, payoutChangeDelay, authorizationExpiry,
      attestationValidity, kioskMinGasBalance, each {value > 0, unit}; bounds: 0 < perPaymentCap <= dailyCap,
      authorizationExpiry 30-300 s, withdrawalDelay 600-604800 s, payoutChangeDelay >= 3600 s'
  - name: validator_groups
    type: array
    required: true
    description: Check groups of validate_design_freeze_02.py (register, precedence+banners including
      the stale-literal scan, products, protocol+vectors, wbs including schedule feasibility, acceptance,
      conflicts, redaction); each named assertion has a known-bad fixture under docs/content/planning/fixtures/df02/<group>/<assertion>/
      run by --self-test; every group reads HEAD and fails on a dirty worktree
  - name: precedence
    type: array
    required: true
    description: Reading-order entries in REPOSITORY-CHECKPOINT.md and docs/README.md, each naming the
      governing freeze id; DF-20260925-02 is listed before DF-20260920-01
  - name: product_id_map
    type: object
    required: true
    description: One-to-one mapping of DF-01 product ids B-01..B-10 to P01..P10, with each P id marked
      buildable or out of cycle
  - name: time_anchor
    type: object
    required: true
    description: 'Operator-signed time written during rental setup: timestamp, operator signature, monotonic
      (not earlier than the previous anchor), invalid after power loss until re-anchored; delivered this
      cycle by the P05 provisioning script over the BLE setup session in place of the design-only P02
      phone setup app'
evaluation_principles:
- name: Decision fidelity
  weight: 1.0
  description: Every value in the generated documents matches what the interview and the acceptance guard
    settled, with no silently reintroduced DF-01 value.
- name: Baseline integrity
  weight: 0.95
  description: DF-20260920-01 and its hash-pinned generated artifacts stay byte-identical and the regression
    set keeps passing; DF-02 supersedes through reading order and banners rather than by editing history.
- name: Conflict closure
  weight: 0.9
  description: The x-bar blocking conflicts F1, F2 and F3 each have exactly one current answer, and no
    surviving document asserts a contradicting value without a superseded banner.
- name: Cross-document consistency
  weight: 0.9
  description: Each normative value exists once (register, schema or vectors) and every other document
    cites it by decision id, so values cannot drift.
- name: Buildability by three people
  weight: 0.8
  description: Each product plan is sized to its owner role within the 12-week window and names the cut
    that protects the week-12 demo when a gate slips.
- name: Specification testability
  weight: 0.8
  description: Requirements are written so a firmware, kiosk or contract test can decide them — concrete
    fields, caps, timeouts and reason codes rather than prose intent.
- name: Security-claim honesty
  weight: 0.75
  description: 'The documents state accepted weaknesses plainly: custodial deposits, operator key single
    point of failure, unaudited contract, TF-M-only protection until the SE lands, and the design-only
    waivers.'
- name: Redaction discipline
  weight: 0.7
  description: 'Committed documents carry only shortened hashes and addresses with sha256: checksums;
    no keys, no full addresses, no personal data.'
exit_conditions:
- name: Freeze set complete
  description: The DF-02 register, its rendered md and its build/validate pair exist and validate, while
    the DF-01 regression set still passes.
  criteria: validate_design_freeze_02.py --check register and --self-test exit 0; validate_design_freeze.py,
    validate_product_wbs.py and check_markdown_links.py still exit 0
- name: Product documentation complete
  description: All six buildable products carry four decision-citing documents linked from their products/pNN-*/README.md,
    and P02/P03/P08/P09 are marked out of cycle.
  criteria: 24 product documents present, non-trivial and citing decision ids; no docs/content/products
    directory for the four out-of-cycle products
- name: Protocol frozen
  description: The md + schema + vectors specify the BLE GATT transport, NFC handover, framing, message
    flow, outcomes, reason codes and the two signed types.
  criteria: Schema parses with exactly two types and the nine PaymentAuthorization fields; vectors match
    the schema
- name: WBS regenerated
  description: The DF-02 WBS exists as new files with gates, owners and cut order.
  criteria: product-worklist-and-12week-wbs-02.{csv,md} present and limited to the six buildable products
- name: Acceptance bar recorded
  description: week12-log.md lists W12-01..W12-12 with evidence artifacts.
  criteria: All twelve item ids and all five reason codes present
- name: Contradictions resolved
  description: Every contradicting hand-written doc is bannered and F1/F2/F3 each map to a resolving DF-02
    decision.
  criteria: Banner on the first line of each of the ten files; resolves covers F1, F2 and F3
- name: Blocked on an unsettled premise
  description: Work stops for a decision only the user can make — for example if the finalized-tag observation
    fails the 1-hour reorg poll and a confirmation depth must be chosen.
  criteria: A named decision is required that the interview did not settle, recorded with the options
    and the evidence that forced it
