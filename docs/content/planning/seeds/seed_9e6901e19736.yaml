goal: 'Deliver the documentation baseline for the NU-54V-DK merchant-authenticated payment signer, whose
  approved product goal is: the NU-54V-DK (nRF54L15) device, using a non-exportable key generated at rental,
  signs an EIP-712 payment authorization with a physical button only for orders verified by an operator
  merchant attestation and the on-chain registry, after displaying orderId, token, payout and amount;
  the P04 kiosk receives it over BLE, pays gas and submits it to the pre-deposit settlement contract (P06)
  on StableNet testnet 8283, which enforces registry, caps, nonce, order uniqueness and expiry; a finalized
  PaymentSettled event decides paid; week 12 passes on 20 consecutive successes, 8 refusal demos (the
  5 agreed codes plus 3 device-side codes) and security checks. This cycle produces: the DF-20260925-02
  decision register superseding DF-20260920-01 (JSON register rendered to md, with its own build/validate
  pair), a regenerated 12-week WBS for DF-02 as new files, the precedence switch plus superseded banners
  on the contradicting hand-written docs, a normative BLE GATT + EIP-712 protocol specification (md +
  JSON schema + test vectors) under docs/content/specifications/protocol/, plan/srs/use-cases/design for
  the six buildable products (P01, P04, P05, P06, P07, P10) under docs/content/products/pNN/, and the
  week-12 acceptance log template under docs/content/acceptance/week12-log.md.'
