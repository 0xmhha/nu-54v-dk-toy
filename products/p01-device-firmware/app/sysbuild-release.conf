# Release build (python3 scripts/fw.py build --release): MCUboot boots only images signed with
# the offline key (P01-FR-15). The key path comes from NU54_SIGNING_KEY, never from this
# repository; the vendor and MCUboot sample keys are public.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
# Updates arrive only over wired serial recovery, which writes the one application slot.
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
