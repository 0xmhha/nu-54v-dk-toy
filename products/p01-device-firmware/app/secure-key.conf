# Spending wallet with its key in the Arm TrustZone secure side
# (python3 scripts/fw.py build --release --spending --secure-key, board target .../cpuapp/ns).
# TF-M's crypto partition generates and uses the key; the encrypted Internal Trusted Storage of
# the secure side keeps it. The application runs non-secure and reaches the key only through PSA
# calls. Built and checked on the host only: not provisioned, not qualified, never flash
# (docs/content/commercial/architecture/board-secure-key-and-advertising.md).
CONFIG_NU54_SECURE_KEY=y
# The non-secure side keeps no key store of its own.
CONFIG_SECURE_STORAGE=n
# TF-M's crypto partition keeps persistent keys only with this on. Off, the SDK builds TF-M with
# CRYPTO_STORAGE_DISABLED and the wallet key would not outlast a restart.
CONFIG_MBEDTLS_PSA_CRYPTO_STORAGE_C=y
# The wallet data is in Internal Trusted Storage; nothing uses Protected Storage.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n
# Every record and every persistent key is one storage asset, and TF-M's default is 10. The
# spending profile can hold 44 at once: 9 keys, 6 owner records, 5 installation records, 4 PIN and
# setup records, 16 orders, the daily total and 3 wallet records. 64 leaves room, and 64 file
# entries of 60 bytes still fit the one 4 KiB metadata block TF-M allows; more would stop the
# storage at start-up, not at build time. Computed from the TF-M sources, not yet run on a board.
CONFIG_TFM_ITS_NUM_ASSETS_OVERRIDE=y
CONFIG_TFM_ITS_NUM_ASSETS=64
# The combined TF-M image starts at the parent slot, while zephyr,code-partition names its
# non-secure child. Nordic's default --rom-fixed would record the child address and MCUboot
# would refuse it against the parent slot (same reason as owner-limits-tfm.conf).
CONFIG_NCS_MCUBOOT_IMGTOOL_SET_ROM_FIXED_ADDRESS=n
