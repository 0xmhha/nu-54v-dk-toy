# MCUboot image of the release build. Updates only over wired serial recovery (SMP over UART,
# P01-FR-15): hold SW1 (mcuboot-button0) while resetting; LED1 (mcuboot-led0) shows recovery.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_MCUBOOT_INDICATION_LED=y
# The UART carries SMP only, and the bootloader must fit the 62 KB boot partition.
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_SIZE_OPTIMIZATIONS=y
