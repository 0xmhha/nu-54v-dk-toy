# Debug lock (P01-NFR-02, W12-10), added with --approtect for the bootloader and the app. Only
# an erase-all through the debug port opens the board again, which removes the device key and
# setup; with one board this runs once, at the end of week 12, after the NVM dump test.
CONFIG_NRF_APPROTECT_LOCK=y
CONFIG_NRF_SECURE_APPROTECT_LOCK=y
