# Release application (python3 scripts/fw.py build --release): rental setup only, and no console
# or logs, since the UART belongs to MCUboot serial recovery (P01 SRS interfaces).
CONFIG_NU54_DEV_SETUP=n
CONFIG_NU54_DEV_UNPAIRED_ANCHOR=n
CONFIG_NU54_REQUIRE_SECURE_SESSION=y
CONFIG_NU54_REQUIRE_PHONE=y
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
