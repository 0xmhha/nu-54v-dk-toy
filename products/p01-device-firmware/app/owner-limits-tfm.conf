# Compile-only W27 protected-storage profile. Not qualified for production or flashing.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y
CONFIG_TFM_PS_ROLLBACK_PROTECTION=y
CONFIG_NU54_EXPERIMENTAL_W27_QUALIFICATION=y

CONFIG_NU54_EXPERIMENTAL_OWNER_LIMITS_PSA=y
# Combined TF-M image starts at parent slot, whereas zephyr,code-partition names
# its NS child. Nordic's default --rom-fixed would record the child address and
# MCUboot would reject it against the parent slot. This experimental dual-slot
# layout uses the unambiguous primary slot; do not use it for shared slots.
CONFIG_NCS_MCUBOOT_IMGTOOL_SET_ROM_FIXED_ADDRESS=n
