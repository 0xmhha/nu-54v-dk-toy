# Long standby for the spending wallet (python3 scripts/fw.py build --release --spending --standby).
# The release application prints nothing, but the board default keeps the UART driver. Without
# device power management that driver starts its receiver at start-up and never stops it
# (zephyr/drivers/serial/uart_nrfx_uarte.c), and a running receiver keeps the high-frequency clock
# on between advertising events. This removes the driver from the application image only: MCUboot
# is a separate image and keeps its UART for wired serial recovery.
# Not together with --security-counter, whose update path uses this UART in the application.
# Read from the driver source and the generated configuration. The current is not measured yet.
CONFIG_SERIAL=n
