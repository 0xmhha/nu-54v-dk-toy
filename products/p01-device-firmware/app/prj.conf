# Skeleton: console log, LEDs and buttons (board_io.c). Features arrive per WBS
# (P01-02 key, P01-03 BLE, P01-04 signing) as separate Kconfig fragments.
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Device key (P01-FR-04): PSA Crypto on CRACEN, a persistent secp256k1 key with deterministic
# ECDSA. Week 7 keeps it in Zephyr Secure storage (no TF-M); week 8 moves it to TF-M ITS.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_DRIVER_OBERON=n
CONFIG_PSA_CRYPTO_DRIVER_CRACEN=y
CONFIG_PSA_WANT_ECC_SECP_K1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
# Needed for psa_export_public_key on a key pair; the key policy (no EXPORT usage) still keeps
# the private key inside PSA.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y
CONFIG_PSA_WANT_ALG_HMAC=y
# Rental setup keeps the PIN as an HMAC under a device-held key (device_setup.c).
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
# Payment session secure channel (payment-protocol.md 4.1): HKDF-SHA256 and AES-128-GCM.
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_MBEDTLS_PSA_CRYPTO_STORAGE_C=y
CONFIG_SECURE_STORAGE=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192

# Payment link (payment-protocol.md 3, 4): BLE peripheral with the payment GATT service, one
# central at a time, ATT_MTU up to 247 so a fragment carries up to 242 envelope bytes.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NU54 Signer"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_SETTINGS_RUNTIME=y
