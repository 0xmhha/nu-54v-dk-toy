# P06 settlement contracts (DF-20260925-02, [N07][N25]).
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# StableNet supports Prague features (EIP-7702); pin it so gas and bytecode do not move with
# the default of newer Foundry releases.
evm_version = "prague"
# Tests read the shared EIP-712 vectors ([N21]).
fs_permissions = [
    { access = "read", path = "../../docs/content/specifications/protocol" },
    # The deploy script reads the register parameters.
    { access = "read", path = "../../docs/content/planning/design-freeze-checkpoint-02.json" },
]

# Invariant runs are kept small for CI; raise them locally when hardening (WBS2-P06-05).
[invariant]
runs = 64
depth = 200

[rpc_endpoints]
sandbox = "http://127.0.0.1:8545"
stablenet_testnet = "https://api.test.stablenet.network/"
