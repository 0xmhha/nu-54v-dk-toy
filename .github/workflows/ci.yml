# Monorepo CI ([N25]): the same make targets developers run locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make docs-check

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/protocol/go/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - uses: foundry-rs/foundry-toolchain@v1
      # P01 firmware needs the NCS toolchain and is built locally; CI runs the host tests of core/.
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      - run: make lint
      - run: make test
