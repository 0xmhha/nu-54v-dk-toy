# Local sandbox for DF-20260925-02 ([N25]).
# anvil stands in for StableNet 8283 during development; gate evidence still comes
# from the StableNet testnet. Start with: docker compose -f sandbox/compose.yaml up -d
name: nu54-sandbox

services:
  chain:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil"]
    # --slots-in-an-epoch 1: by default anvil's "finalized" tag lags latest by 64 blocks,
    # which would push every kiosk finality check past its 10 s budget.
    command: ["--host", "0.0.0.0", "--chain-id", "8283", "--block-time", "1", "--slots-in-an-epoch", "1"]
    ports:
      - "${NU54_RPC_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      retries: 10

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nu54
      POSTGRES_PASSWORD: nu54-local-only
      POSTGRES_DB: nu54
    ports:
      - "${NU54_DB_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nu54 -d nu54"]
      interval: 5s
      retries: 10

volumes:
  db-data:
